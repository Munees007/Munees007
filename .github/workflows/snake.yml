name: Generate Contribution Snake

on:
  # Rebuild every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Rebuild when this workflow changes on main
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Munees007
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#EF4444&color_dots=#161618,#450a0a,#7f1d1d,#b91c1c,#ef4444

      - name: Push the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
